buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Force AGP version 8.7.2 because React Native 0.83.1 references non-existent 8.12.0
        androidGradlePluginVersion = "8.7.2"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$androidGradlePluginVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
    // Force AGP version in buildscript dependencies to override React Native's version catalog
    configurations.all {
        resolutionStrategy {
            force "com.android.tools.build:gradle:$androidGradlePluginVersion"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
