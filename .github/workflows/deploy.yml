name: Deploy Test App

on:
  push:
    branches: [ "main" ]  # Only main branch pushes for GitHub Pages
  pull_request:
    branches: [ "**" ]  # Pull requests from any branch for Netlify

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write
  pull-requests: write
  issues: write

jobs:
  # GitHub Pages deployment (only on main branch push)
  build-and-deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Netlify deployment (only on pull requests)
  deploy-netlify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Deploy to Netlify
      id: netlify
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './dist'
        production-branch: master
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions - ${{ github.event.head_commit.message }}"
        enable-pull-request-comment: false
        enable-commit-comment: false
        overwrites-pull-request-comment: false
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      timeout-minutes: 1

    - name: Create Deployment Status
      uses: actions/github-script@v7
      with:
        script: |
          const deployUrl = '${{ steps.netlify.outputs.deploy-url }}';

          // Create a deployment
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            environment: context.ref === 'refs/heads/master' ? 'production' : 'preview',
            auto_merge: false,
            required_contexts: [],
            description: `Netlify deployment for ${context.ref}`
          });

          if (deployment.data.id) {
            // Set deployment status to success with the URL
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: deployUrl,
              log_url: deployUrl,
              description: 'Deployment successful'
            });
          }

          // Find associated PRs for this commit and comment
          const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha
          });

          for (const pr of prs.data) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## 🚀 Netlify Deployment\n\n**Deploy URL:** ${deployUrl}\n\n**Branch:** \`${{ github.ref_name }}\`\n**Commit:** \`${context.sha.substring(0, 7)}\``
            });
          }

          // Write to job summary
          await core.summary
            .addHeading('🚀 Netlify Deployment')
            .addLink('Deploy URL', deployUrl)
            .addRaw(`\n\n**Branch:** \`${{ github.ref_name }}\``)
            .write();
